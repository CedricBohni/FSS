[package]
name = "fss-gates"
version = "0.1.0"
edition = "2021"
description = "Semi-honest 2PC FSS gates (less-than-zero, arithmetic right shift) over Z_{2^n}, n <= 256, after Boyle et al. 2021"

[dependencies]
# libfss from https://github.com/nann-cheng/FSS-KRE (commit eb79d1b), vendored with a PRG security fix.
# See vendor/libfss/PATCHES.md.
fss = { path = "vendor/libfss" }
rand = "0.7.3"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
num-bigint = "0.3"
# 256-bit integers. 1.5.3 needs a newer rustc than 1.75 (const from_str_radix).
ethnum = "=1.5.0"

# Keep the AES-based PRG fast in `cargo test` / debug builds.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
